name: Validate framework and public data
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate canonical data and generated views
        run: python scripts/validate.py --check-generated
      - name: Verify local workspace and sharing protections
        run: python -m unittest discover -s tests -v
      - name: Check shared files and historical paths
        run: python scripts/check_public.py
